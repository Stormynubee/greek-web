    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
          Supabase OAuth callback lands with #access_token=... in the URL.
          The Supabase JS library handles it, but a quick reload guarantees the
          session is fully persisted before React renders. This must run
          before any other script (deferred bundles).
        -->
        <script>
          (function () {
            // The Supabase JS library (auth-detectSessionInUrl: true) reads the
            // OAuth hash fragment, persists the session to localStorage, then
            // strips the hash. We just trigger a single page load that has
            // the hash present so the library processes it on the very first
            // render. We must NOT reload — the reload would race the library
            // and leave localStorage empty.
            // Do nothing extra here; the Supabase library handles the hash.
          })();
        </script>

    </body>
