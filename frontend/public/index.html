        <meta charset="utf-8" />

        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will

        <title>GreekGodBerry · Samurai Points</title>

    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
          Supabase OAuth callback lands with #access_token=... in the URL.
          The Supabase JS library handles it, but a quick reload guarantees the
          session is fully persisted before React renders. This must run
          before any other script (deferred bundles).
        -->
        <script>
          (function () {
            try {
              // The Supabase JS library auto-detects the OAuth hash on page load
              // and persists the session to localStorage. If we reload too early,
              // the second load sees no session and the user lands logged-out.
              // 200ms is enough for detectSessionInUrl to write the session.
              if (window.location.hash && window.location.hash.indexOf("access_token") !== -1) {
                setTimeout(function () {
                  window.location.replace(window.location.pathname + window.location.search);
                }, 200);
              }
            } catch (e) { /* noop */ }
          })();
        </script>

    -->
    </body>
</html>
